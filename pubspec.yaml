name: apna_pay_demo
description: APNA PAY demo wallet application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/apna_pay_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/apna_pay_icon.png"
  adaptive_icon_background: "#064C3A"
  adaptive_icon_foreground: "assets/apna_pay_icon.png"
  min_sdk_android: 21
